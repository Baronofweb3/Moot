
name: contracts
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      # near-sdk 5.30 requires rustc >= 1.95.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
 
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
 
      - name: Build token wasm
        working-directory: contracts/moot-ft
        run: cargo near build non-reproducible-wasm
 
      - name: Embed token wasm into core
        run: |
          mkdir -p contracts/moot-core/res
          F=$(find . -name moot_ft.wasm -path '*near*' | head -1)
          echo "token wasm: $F"
          cp "$F" contracts/moot-core/res/moot_ft.wasm
 
      - name: Unit tests
        run: cargo test --workspace
 
      - name: Build core wasm
        working-directory: contracts/moot-core
        run: cargo near build non-reproducible-wasm
 
      - name: Collect wasm
        run: |
          mkdir -p out
          cp "$(find . -name moot_core.wasm -path '*near*' | head -1)" out/moot_core.wasm
          cp contracts/moot-core/res/moot_ft.wasm out/moot_ft.wasm
          ls -la out
 
      - uses: actions/upload-artifact@v4
        with:
          name: moot-wasm
          path: out/
 
      - name: Inspect wasm for features the NEAR runtime may reject (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y wabt >/dev/null
          for f in out/*.wasm; do
            echo "== $f"; wasm-objdump -h "$f" | head -20
            wasm2wat "$f" 2>/dev/null | grep -cE "memory.copy|memory.fill|table.copy|ref.null|i32.extend8_s" || true
          done
 
