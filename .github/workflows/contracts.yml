name: contracts
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with: { targets: wasm32-unknown-unknown }
      - run: cargo install cargo-near --locked
      - name: Build token wasm
        working-directory: contracts/moot-ft
        run: cargo near build non-reproducible-wasm
      - name: Embed token wasm into core
        run: |
          mkdir -p contracts/moot-core/res
          cp target/near/moot_ft/moot_ft.wasm contracts/moot-core/res/moot_ft.wasm
      - name: Unit tests (real wasm embedded)
        run: cargo test --workspace
      - name: Build core wasm
        working-directory: contracts/moot-core
        run: cargo near build non-reproducible-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: moot-wasm
          path: |
            target/near/moot_core/moot_core.wasm
            target/near/moot_ft/moot_ft.wasm
 
