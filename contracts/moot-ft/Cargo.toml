[package]
name = "moot-ft"
version = "0.1.0"
edition = "2021"
description = "MOOT fixed-supply NEP-141 token. No mint function after init."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
