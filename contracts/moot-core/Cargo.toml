[package]
name = "moot-core"
version = "0.1.0"
edition = "2021"
description = "MOOT core: token factory, constant-product AMM, 30/50/20 fee ledger"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
